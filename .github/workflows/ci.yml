name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache BB plugin toolchain
        uses: actions/cache@v6
        with:
          path: ~/.bb/plugins/toolchain-*
          key: bb-toolchain-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: bb-toolchain-${{ runner.os }}-

      - name: Typecheck, test, and build every plugin
        run: npm run check

      - name: Build every plugin in isolation, as bb plugin install does
        run: npm run check:isolated

      - name: Ensure checks leave tracked files clean
        run: git diff --exit-code

  macos-bash:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run prepare-review.sh with the system bash 3.2
        run: TEST_BASH=/bin/bash bash plugins/plugin-update-review/test/prepare-review-root.test.sh

      - name: Run ci-status.sh with the system bash 3.2
        run: TEST_BASH=/bin/bash bash plugins/plugin-update-review/test/ci-status.test.sh

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate extension manifests and scripts
        run: |
          for manifest in extensions/*/manifest.json; do
            echo "Checking $manifest"
            node --input-type=module -e "
              import { readFileSync } from 'node:fs';
              const path = process.argv[1];
              const manifest = JSON.parse(readFileSync(path, 'utf8'));
              if (manifest.manifest_version !== 3) {
                throw new Error(path + ': expected manifest_version 3');
              }
              if (typeof manifest.browser_specific_settings?.gecko?.id !== 'string') {
                throw new Error(path + ': expected browser_specific_settings.gecko.id for Firefox');
              }
              const background = manifest.background ?? {};
              if (background.service_worker && !background.scripts) {
                throw new Error(path + ': Firefox ignores background.service_worker; add background.scripts');
              }
            " "$manifest"
          done
          for script in extensions/*/*.js; do
            echo "Parsing $script"
            node --check "$script"
          done

      - name: Lint extensions for Firefox
        run: |
          for dir in extensions/*/; do
            echo "Linting $dir"
            npx --yes web-ext@10.7.0 lint \
              --source-dir "$dir" \
              --no-config-discovery
          done
