version: 2

updates:
  # The root lockfile covers every npm workspace under plugins/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # Dependabot puts each dependency in the first group it matches, so
    # bb-sdk comes first. The bb SDK packages are 0.x, where a minor bump can
    # break plugins, so they get a PR of their own for every update type and
    # never auto-merge. Other major updates match no group, so each one opens
    # its own PR.
    groups:
      bb-sdk:
        patterns: ["@get-bb/*", "bb-app"]
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    # bb shims these packages at runtime, and `bb plugin types --check`
    # requires each plugin to declare the host's version. `bb plugin types`
    # updates them along with the bb SDK. The same check requires
    # @get-bb/plugin-sdk to match the SDK bb-app bundles, which can lag the
    # npm release, so `bb plugin types` sets it after a bb-app bump.
    ignore:
      - dependency-name: "@get-bb/plugin-sdk"
      - dependency-name: "@pierre/diffs"
      - dependency-name: "@radix-ui/react-alert-dialog"
      - dependency-name: "@radix-ui/react-context-menu"
      - dependency-name: "@radix-ui/react-dialog"
      - dependency-name: "@radix-ui/react-dropdown-menu"
      - dependency-name: "@radix-ui/react-hover-card"
      - dependency-name: "@radix-ui/react-menubar"
      - dependency-name: "@radix-ui/react-navigation-menu"
      - dependency-name: "@radix-ui/react-popover"
      - dependency-name: "@radix-ui/react-select"
      - dependency-name: "@radix-ui/react-tooltip"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ["*"]
