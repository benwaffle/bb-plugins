version: 2

updates:
  # The root lockfile covers every npm workspace under plugins/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # Dependabot puts each dependency in the first group it matches, so
    # bb-sdk comes first. The bb SDK packages are 0.x, where a minor bump can
    # break plugins, so they get a PR of their own for every update type and
    # never auto-merge. Other major updates match no group, so each one opens
    # its own PR.
    groups:
      bb-sdk:
        patterns: ["@get-bb/*", "bb-app"]
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ["*"]
