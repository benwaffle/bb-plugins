version: 2

updates:
  # The root lockfile covers every npm workspace under plugins/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # Major updates match no group, so each one opens its own PR.
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ["*"]
