# Summaries written for telecom-ref, not specification text.
# Reference points across 2G/3G, EPC, IMS, and 5GC.

# --- Radio and access (2G/3G/4G) ---

- id: Um
  name: Um
  generations: [2G]
  endpoints: [UE, BTS]
  protocol: GSM radio (RR/MM/CC)
  aliases: []
  description: >-
    The GSM air interface. It carries radio resource, mobility, call control, and SMS signalling plus
    circuit-switched and GPRS user data between the mobile and the BTS.
  spec: ["TS 23.002", "TS 44.018"]

- id: Abis
  name: Abis
  generations: [2G]
  endpoints: [BTS, BSC]
  protocol: Abis (LAPD)
  aliases: []
  description: >-
    The link between a BTS and its BSC. It carries radio control commands, measurement reports, and the
    traffic channels for the cells served by the BTS.
  spec: ["TS 23.002", "TS 48.058"]

- id: A
  name: A
  generations: [2G]
  endpoints: [BSC, MSC]
  protocol: BSSAP
  aliases: []
  description: >-
    The circuit-switched interface between the GSM access network and the MSC. It carries call setup,
    mobility, and handover signalling and the voice bearers.
  spec: ["TS 23.002", "TS 48.008"]

- id: Gb
  name: Gb
  generations: [2G]
  endpoints: [BSC, SGSN]
  protocol: BSSGP/NS
  aliases: []
  description: >-
    The GPRS interface between the GSM access network and the SGSN. It carries LLC frames with user data
    and GMM/SM signalling, plus flow control and paging.
  spec: ["TS 23.060", "TS 48.018"]

- id: Uu
  name: Uu
  generations: [3G]
  endpoints: [UE, NodeB]
  protocol: UTRA radio (RRC/NAS)
  aliases: []
  description: >-
    The UMTS air interface. It carries RRC signalling with the RNC, NAS signalling with the core, and
    user data for CS and PS services.
  spec: ["TS 23.002", "TS 25.331"]

- id: Iub
  name: Iub
  generations: [3G]
  endpoints: [NodeB, RNC]
  protocol: NBAP
  aliases: []
  description: >-
    The interface between a NodeB and its controlling RNC. It carries cell and radio link configuration
    and the frame protocol that transports user data.
  spec: ["TS 23.002", "TS 25.433"]

- id: Iur
  name: Iur
  generations: [3G]
  endpoints: [RNC, RNC]
  protocol: RNSAP
  aliases: []
  description: >-
    The interface between two RNCs. It supports soft handover and relocation by letting a serving RNC
    use radio links controlled by a drift RNC.
  spec: ["TS 23.002", "TS 25.423"]

- id: Iu-CS
  name: Iu-CS
  generations: [3G]
  endpoints: [RNC, MSC]
  protocol: RANAP
  aliases: []
  description: >-
    The circuit-switched interface between UTRAN and the MSC. It carries RANAP signalling for call
    setup, mobility, and relocation, and the CS user plane.
  spec: ["TS 23.002", "TS 25.413"]

- id: Iu-PS
  name: Iu-PS
  generations: [3G]
  endpoints: [RNC, SGSN]
  protocol: RANAP / GTP-U
  aliases: []
  description: >-
    The packet-switched interface between UTRAN and the SGSN. It carries RANAP signalling for RAB setup
    and relocation, and GTP-U user data tunnels.
  spec: ["TS 23.060", "TS 25.413"]

- id: LTE-Uu
  name: LTE-Uu
  generations: [4G]
  endpoints: [UE, eNodeB]
  protocol: LTE-Uu RRC/NAS
  aliases: [E-UTRAN Uu]
  description: >-
    The LTE air interface. It carries RRC signalling with the eNodeB, NAS signalling relayed to the MME,
    and user data on data radio bearers.
  spec: ["TS 23.401 §4.2", "TS 36.331"]

- id: X2
  name: X2
  generations: [4G]
  endpoints: [eNodeB, eNodeB]
  protocol: X2AP / GTP-U
  aliases: []
  description: >-
    The interface between neighbouring eNodeBs. It carries handover preparation, load and interference
    coordination, and dual connectivity signalling, and forwards user data during handover.
  spec: ["TS 23.401 §4.2", "TS 36.423"]

- id: S1-MME
  name: S1-MME
  generations: [4G]
  endpoints: [eNodeB, MME]
  protocol: S1AP
  aliases: [S1-C]
  description: >-
    The control interface between the eNodeB and the MME. It carries UE context and E-RAB setup, paging,
    handover signalling, and transports NAS messages between the UE and the MME.
  spec: ["TS 23.401 §4.2", "TS 36.413"]

- id: S1-U
  name: S1-U
  generations: [4G]
  endpoints: [eNodeB, SGW]
  protocol: GTP-U
  aliases: []
  description: >-
    The user-plane interface between the eNodeB and the SGW. It carries per-bearer GTP-U tunnels with the
    UE's uplink and downlink packets.
  spec: ["TS 23.401 §4.2", "TS 29.281"]

# --- EPC control and user plane ---

- id: S3
  name: S3
  generations: [3G, 4G]
  endpoints: [SGSN, MME]
  protocol: GTPv2-C
  aliases: []
  description: >-
    The link between an SGSN and an MME. It exchanges UE context and bearer information for idle- and
    connected-mode mobility between 2G/3G and LTE.
  spec: ["TS 23.401 §4.2", "TS 29.274"]

- id: S4
  name: S4
  generations: [3G, 4G]
  endpoints: [SGSN, SGW]
  protocol: GTPv2-C / GTP-U
  aliases: []
  description: >-
    The interface between an SGSN and the SGW. It carries bearer control and user data for 2G/3G access
    anchored in the EPC.
  spec: ["TS 23.401 §4.2", "TS 29.274"]

- id: S5
  name: S5
  generations: [4G]
  endpoints: [SGW, PGW]
  protocol: GTPv2-C / GTP-U
  aliases: []
  description: >-
    The interface between the SGW and PGW within one network. It carries bearer and PDN connection
    management and the user-plane tunnels; a PMIPv6 variant also exists.
  spec: ["TS 23.401 §4.2", "TS 29.274"]

- id: S8
  name: S8
  generations: [4G]
  endpoints: [SGW, PGW]
  protocol: GTPv2-C / GTP-U
  aliases: []
  description: >-
    The roaming form of S5, between a visited-network SGW and a home-network PGW. It carries the same
    bearer signalling and user tunnels across PLMN borders.
  spec: ["TS 23.401 §4.2", "TS 29.274"]

- id: S10
  name: S10
  generations: [4G]
  endpoints: [MME, MME]
  protocol: GTPv2-C
  aliases: []
  description: >-
    The interface between two MMEs. It transfers UE context during MME relocation, for example in
    tracking area update or handover.
  spec: ["TS 23.401 §4.2", "TS 29.274"]

- id: S11
  name: S11
  generations: [4G]
  endpoints: [MME, SGW]
  protocol: GTPv2-C
  aliases: []
  description: >-
    The control interface between the MME and the SGW. It creates, modifies, and deletes sessions and
    bearers, and carries downlink data notifications that trigger paging.
  spec: ["TS 23.401 §4.2", "TS 29.274"]

- id: S12
  name: S12
  generations: [3G, 4G]
  endpoints: [RNC, SGW]
  protocol: GTP-U
  aliases: []
  description: >-
    An optional user-plane path between UTRAN and the SGW when direct tunnel bypasses the SGSN. It
    carries GTP-U user data tunnels.
  spec: ["TS 23.401 §4.2", "TS 29.281"]

- id: SGi
  name: SGi
  generations: [4G]
  endpoints: [PGW, DN]
  protocol: IP
  aliases: []
  description: >-
    The interface between the PGW and an external or operator packet data network. It carries the UE's
    IP traffic, and may use RADIUS or Diameter toward external AAA servers.
  spec: ["TS 23.401 §4.2", "TS 29.061"]

- id: Sv
  name: Sv
  generations: [4G]
  endpoints: [MME, MSC]
  protocol: GTPv2-C
  aliases: []
  description: >-
    The interface between the MME and an MSC server used for single radio voice call continuity. It
    requests the CS side to prepare a handover when an IMS voice call moves from LTE to 2G/3G.
  spec: ["TS 23.216", "TS 29.280"]

- id: SGs
  name: SGs
  generations: [4G]
  endpoints: [MME, MSC]
  protocol: SGsAP
  aliases: []
  description: >-
    The interface between the MME and the MSC/VLR for CS fallback and SMS over SGs. It handles combined
    location updates, CS paging, and transfer of SMS for LTE-attached UEs.
  spec: ["TS 23.272", "TS 29.118"]

- id: Sm
  name: Sm
  generations: [4G]
  endpoints: [MME, MBMS-GW]
  protocol: GTPv2-C
  aliases: []
  description: >-
    The interface between the MBMS-GW and the MME. It carries MBMS session start, update, and stop
    signalling so the MME can set up broadcast in the radio network.
  spec: ["TS 23.246", "TS 29.274"]

- id: SBc
  name: SBc
  generations: [4G]
  endpoints: [MME, CBC]
  protocol: SBc-AP
  aliases: []
  description: >-
    The interface between the CBC and the MME. It carries public warning messages that the MME
    distributes to eNodeBs for cell broadcast.
  spec: ["TS 23.041", "TS 29.168"]

# --- EPC Diameter interfaces ---

- id: S6a
  name: S6a
  generations: [4G]
  endpoints: [MME, HSS]
  protocol: Diameter
  apps: [16777251]
  aliases: []
  description: >-
    The interface between the MME and the HSS. It carries authentication vector requests, location
    updates, subscription data download, and purge and cancel location procedures.
  spec: ["TS 23.401 §4.2", "TS 29.272"]

- id: S6d
  name: S6d
  generations: [3G, 4G]
  endpoints: [SGSN, HSS]
  protocol: Diameter
  apps: [16777251]
  aliases: []
  description: >-
    The SGSN counterpart of S6a. It lets an S4-SGSN fetch authentication data and subscription profiles
    from the HSS over Diameter rather than MAP.
  spec: ["TS 23.401 §4.2", "TS 29.272"]

- id: S13
  name: S13
  generations: [4G]
  endpoints: [MME, EIR]
  protocol: Diameter
  apps: [16777252]
  aliases: []
  description: >-
    The interface between the MME and the EIR. It checks the device IMEI and returns whether the
    equipment is allowed, blocked, or tracked.
  spec: ["TS 23.401 §4.2", "TS 29.272"]

- id: S13p
  name: S13'
  generations: [3G, 4G]
  endpoints: [SGSN, EIR]
  protocol: Diameter
  apps: [16777252]
  aliases: []
  description: >-
    The SGSN version of S13. It performs the same equipment identity check against the EIR using
    Diameter.
  spec: ["TS 23.401 §4.2", "TS 29.272"]

- id: Gx
  name: Gx
  generations: [3G, 4G]
  endpoints: [PCEF, PCRF]
  protocol: Diameter
  apps: [16777238]
  aliases: []
  description: >-
    The policy interface between the PCEF in the PGW or GGSN and the PCRF. The PCRF installs, modifies,
    and removes PCC rules, and the PCEF reports IP-CAN session events and usage.
  spec: ["TS 23.203", "TS 29.212"]

- id: Gxa
  name: Gxa
  generations: [4G]
  endpoints: [BBERF, PCRF]
  protocol: Diameter
  apps: [16777266]
  aliases: []
  description: >-
    The interface between a BBERF in a trusted non-3GPP access gateway and the PCRF. It provisions QoS
    rules for bearer binding when the access uses PMIPv6 or DSMIPv6.
  spec: ["TS 23.203", "TS 29.212"]

- id: Gxc
  name: Gxc
  generations: [4G]
  endpoints: [SGW, PCRF]
  protocol: Diameter
  apps: [16777266]
  aliases: []
  description: >-
    The interface between the BBERF in an SGW and the PCRF, used when S5/S8 is based on PMIPv6. It
    carries QoS rules so the SGW can bind flows to bearers.
  spec: ["TS 23.203", "TS 29.212"]

- id: Sd
  name: Sd
  generations: [4G]
  endpoints: [TDF, PCRF]
  protocol: Diameter
  apps: [16777303]
  aliases: []
  description: >-
    The interface between the TDF and the PCRF. The PCRF installs application detection and control
    rules, and the TDF reports the start and stop of detected applications.
  spec: ["TS 23.203", "TS 29.212"]

- id: St
  name: St
  generations: [4G]
  endpoints: [TSSF, PCRF]
  protocol: Diameter
  apps: [16777349]
  aliases: []
  description: >-
    The interface between the PCRF and the TSSF. It carries traffic steering control rules that tell the
    TSSF which service chain to apply to detected traffic.
  spec: ["TS 23.203", "TS 29.155"]

- id: Sy
  name: Sy
  generations: [4G]
  endpoints: [PCRF, OCS]
  protocol: Diameter
  apps: [16777302]
  aliases: []
  description: >-
    The interface between the PCRF and the OCS. The PCRF subscribes to spending limit counters and the
    OCS reports their status so policy can change when a limit is reached.
  spec: ["TS 23.203", "TS 29.219"]

- id: S9
  name: S9
  generations: [4G]
  endpoints: [PCRF, PCRF]
  protocol: Diameter
  apps: [16777267]
  aliases: []
  description: >-
    The roaming interface between a home and a visited PCRF. It carries policy and QoS rules for UEs
    whose traffic breaks out locally or whose BBERF sits in the visited network.
  spec: ["TS 23.203", "TS 29.215"]

- id: Rx
  name: Rx
  generations: [4G, IMS]
  endpoints: [AF, PCRF]
  protocol: Diameter
  apps: [16777236]
  aliases: []
  description: >-
    The interface between an application function, such as the P-CSCF, and the PCRF. The AF describes
    session media so the PCRF can authorize QoS, and the PCRF reports bearer and access events back.
  spec: ["TS 23.203", "TS 29.214"]

- id: Np
  name: Np
  generations: [4G]
  endpoints: [RCAF, PCRF]
  protocol: Diameter
  apps: [16777342]
  aliases: []
  description: >-
    The interface between the RCAF and the PCRF. It reports RAN user-plane congestion levels for the UEs
    in congested cells.
  spec: ["TS 23.203", "TS 29.217"]

- id: Nt
  name: Nt
  generations: [4G]
  endpoints: [SCEF, PCRF]
  protocol: Diameter
  apps: [16777348]
  aliases: []
  description: >-
    The interface between the SCEF and the PCRF. It lets a third party negotiate a background data
    transfer policy for a group of UEs.
  spec: ["TS 23.682 §4.2", "TS 29.154"]

- id: Ns
  name: Ns
  generations: [4G]
  endpoints: [SCEF, RCAF]
  protocol: Diameter
  apps: [16777347]
  aliases: []
  description: >-
    The interface between the SCEF and the RCAF. The SCEF requests network status, such as congestion,
    for a geographic area on behalf of a service provider.
  spec: ["TS 23.682 §4.2", "TS 29.153"]

- id: Gy
  name: Gy
  generations: [3G, 4G]
  endpoints: [PCEF, OCS]
  protocol: Diameter
  apps: [4]
  aliases: []
  description: >-
    The online charging interface between the PCEF and the OCS. It carries credit control requests that
    reserve quota and report usage for data sessions.
  spec: ["TS 32.251", "TS 32.299"]

- id: Gz
  name: Gz
  generations: [2G, 3G, 4G]
  endpoints: [PCEF, OFCS]
  protocol: Diameter
  apps: [3]
  aliases: []
  description: >-
    The offline charging interface between the gateway and the OFCS. It carries accounting records for
    data sessions; a GTP' variant toward the CGF also exists.
  spec: ["TS 32.251", "TS 32.299"]

- id: Ro
  name: Ro
  generations: [IMS]
  endpoints: [AS, OCS]
  protocol: Diameter
  apps: [4]
  aliases: []
  description: >-
    The online charging interface between a charging trigger function, such as an IMS application
    server or MRFC, and the OCS. It reserves and deducts credit for sessions and events.
  spec: ["TS 32.240", "TS 32.299"]

- id: Rf
  name: Rf
  generations: [IMS]
  endpoints: [S-CSCF, OFCS]
  protocol: Diameter
  apps: [3]
  aliases: []
  description: >-
    The offline charging interface between IMS nodes and the charging data function. It carries
    accounting start, interim, stop, and event records for sessions.
  spec: ["TS 32.240", "TS 32.299"]

# --- Non-3GPP access (TS 23.402) ---

- id: S2a
  name: S2a
  generations: [4G]
  endpoints: [TWAN, PGW]
  protocol: GTPv2-C / GTP-U
  aliases: []
  description: >-
    The interface between trusted non-3GPP access and the PGW. It sets up PDN connections and carries
    user tunnels for UEs on trusted WLAN; a PMIPv6 variant also exists.
  spec: ["TS 23.402 §4.2", "TS 29.274"]

- id: S2b
  name: S2b
  generations: [4G]
  endpoints: [ePDG, PGW]
  protocol: GTPv2-C / GTP-U
  aliases: []
  description: >-
    The interface between the ePDG and the PGW. It sets up PDN connections and carries user tunnels for
    UEs on untrusted non-3GPP access, for example VoWiFi.
  spec: ["TS 23.402 §4.2", "TS 29.274"]

- id: S2c
  name: S2c
  generations: [4G]
  endpoints: [UE, PGW]
  protocol: DSMIPv6
  aliases: []
  description: >-
    A host-based mobility interface between the UE and the PGW. The UE registers its care-of address with
    the PGW acting as home agent over trusted or untrusted non-3GPP access.
  spec: ["TS 23.402 §4.2", "TS 24.303"]

- id: SWa
  name: SWa
  generations: [4G]
  endpoints: [Untrusted-N3GPP-AN, AAA-Server]
  protocol: Diameter
  apps: [16777250]
  aliases: []
  description: >-
    The interface between an untrusted non-3GPP access network and the 3GPP AAA Server. It carries
    access authentication and authorization for the WLAN itself.
  spec: ["TS 23.402 §4.2", "TS 29.273"]

- id: STa
  name: STa
  generations: [4G]
  endpoints: [TWAN, AAA-Server]
  protocol: Diameter
  apps: [16777250]
  aliases: []
  description: >-
    The interface between trusted non-3GPP access and the 3GPP AAA Server. It carries EAP-based access
    authentication and returns authorization data such as allowed APNs and mobility parameters.
  spec: ["TS 23.402 §4.2", "TS 29.273"]

- id: SWd
  name: SWd
  generations: [4G]
  endpoints: [AAA-Proxy, AAA-Server]
  protocol: Diameter
  apps: [16777250, 16777264, 16777272]
  aliases: []
  description: >-
    The roaming interface between a visited 3GPP AAA Proxy and the home 3GPP AAA Server. It relays the
    STa, SWa, SWm, and S6b signalling of roaming UEs.
  spec: ["TS 23.402 §4.2", "TS 29.273"]

- id: SWm
  name: SWm
  generations: [4G]
  endpoints: [ePDG, AAA-Server]
  protocol: Diameter
  apps: [16777264]
  aliases: []
  description: >-
    The interface between the ePDG and the 3GPP AAA Server. It carries EAP-AKA authentication of the UE
    during tunnel setup and returns tunnel authorization data.
  spec: ["TS 23.402 §4.2", "TS 29.273"]

- id: SWn
  name: SWn
  generations: [4G]
  endpoints: [Untrusted-N3GPP-AN, ePDG]
  protocol: IP
  aliases: []
  description: >-
    The path between an untrusted non-3GPP access network and the ePDG. It carries the UE's IPsec tunnel
    traffic toward the ePDG.
  spec: ["TS 23.402 §4.2"]

- id: SWu
  name: SWu
  generations: [4G]
  endpoints: [UE, ePDG]
  protocol: IKEv2/IPsec
  aliases: []
  description: >-
    The secure tunnel between the UE and the ePDG. It carries IKEv2 tunnel setup with EAP-AKA
    authentication and then the UE's user traffic inside IPsec.
  spec: ["TS 23.402 §4.2", "TS 24.302"]

- id: SWx
  name: SWx
  generations: [4G]
  endpoints: [AAA-Server, HSS]
  protocol: Diameter
  apps: [16777265]
  aliases: []
  description: >-
    The interface between the 3GPP AAA Server and the HSS. It carries authentication vector requests,
    registration of the serving AAA Server, and non-3GPP subscription profile download.
  spec: ["TS 23.402 §4.2", "TS 29.273"]

- id: S6b
  name: S6b
  generations: [4G]
  endpoints: [PGW, AAA-Server]
  protocol: Diameter
  apps: [16777272]
  aliases: []
  description: >-
    The interface between the PGW and the 3GPP AAA Server. The PGW registers its identity for a PDN
    connection and can fetch mobility parameters and authorization data.
  spec: ["TS 23.402 §4.2", "TS 29.273"]

# --- Location services ---

- id: SLg
  name: SLg
  generations: [4G]
  endpoints: [MME, GMLC]
  protocol: Diameter
  apps: [16777255]
  aliases: []
  description: >-
    The interface between the GMLC and the MME. The GMLC requests a UE's location, and the MME returns
    the estimate or reports location events such as emergency calls.
  spec: ["TS 23.271", "TS 29.172"]

- id: SLh
  name: SLh
  generations: [4G]
  endpoints: [GMLC, HSS]
  protocol: Diameter
  apps: [16777291]
  aliases: []
  description: >-
    The interface between the GMLC and the HSS. It returns the address of the serving MME or SGSN for a
    UE whose location is requested.
  spec: ["TS 23.271", "TS 29.173"]

- id: SLs
  name: SLs
  generations: [4G]
  endpoints: [MME, E-SMLC]
  protocol: LCS-AP
  aliases: []
  description: >-
    The interface between the MME and the E-SMLC. It carries location requests and responses and
    transports LPP and LPPa positioning messages.
  spec: ["TS 23.271", "TS 29.171"]

- id: Lg
  name: Lg
  generations: [2G, 3G]
  endpoints: [GMLC, MSC]
  protocol: MAP
  aliases: []
  description: >-
    The MAP interface between the GMLC and the serving MSC or SGSN. It carries location requests and
    location reports for 2G/3G UEs.
  spec: ["TS 23.271", "TS 29.002"]

- id: Lh
  name: Lh
  generations: [2G, 3G]
  endpoints: [GMLC, HLR]
  protocol: MAP
  aliases: []
  description: >-
    The MAP interface between the GMLC and the HLR. It returns routing information for location
    requests, such as the address of the serving MSC or SGSN.
  spec: ["TS 23.271", "TS 29.002"]

# --- Machine-type communication and exposure ---

- id: T6a
  name: T6a
  generations: [4G]
  endpoints: [SCEF, MME]
  protocol: Diameter
  apps: [16777346]
  aliases: []
  description: >-
    The interface between the SCEF and the MME. It carries monitoring event configuration and reports
    and non-IP data delivery for IoT devices.
  spec: ["TS 23.682 §4.2", "TS 29.128"]

- id: T6b
  name: T6b
  generations: [3G, 4G]
  endpoints: [SCEF, SGSN]
  protocol: Diameter
  apps: [16777346]
  aliases: []
  description: >-
    The SGSN version of T6a. It carries monitoring events and non-IP data between the SCEF and the SGSN.
  spec: ["TS 23.682 §4.2", "TS 29.128"]

- id: S6t
  name: S6t
  generations: [4G]
  endpoints: [SCEF, HSS]
  protocol: Diameter
  apps: [16777345]
  aliases: []
  description: >-
    The interface between the SCEF and the HSS. It configures monitoring events, receives event reports,
    and provisions communication pattern parameters for UEs.
  spec: ["TS 23.682 §4.2", "TS 29.336"]

- id: S6m
  name: S6m
  generations: [4G]
  endpoints: [MTC-IWF, HSS]
  protocol: Diameter
  apps: [16777310]
  aliases: []
  description: >-
    The interface between the MTC-IWF and the HSS. It maps external device identifiers to IMSI or MSISDN
    and returns serving node information for device triggering.
  spec: ["TS 23.682 §4.2", "TS 29.336"]

- id: S6n
  name: S6n
  generations: [4G]
  endpoints: [MTC-AAA, HSS]
  protocol: Diameter
  apps: [16777310]
  aliases: []
  description: >-
    The interface between the MTC-AAA and the HSS. It maps a device's IMSI to its external identifiers
    for authentication and authorization of machine-type devices on non-3GPP access.
  spec: ["TS 23.682 §4.2", "TS 29.336 §5"]

- id: Tsp
  name: Tsp
  generations: [4G]
  endpoints: [SCS, MTC-IWF]
  protocol: Diameter
  apps: [16777309]
  aliases: []
  description: >-
    The interface between a Services Capability Server and the MTC-IWF. It carries device trigger
    requests and delivery reports.
  spec: ["TS 23.682 §4.2", "TS 29.368"]

- id: T4
  name: T4
  generations: [4G]
  endpoints: [MTC-IWF, SMS-SC, SMS-IWMSC]
  protocol: Diameter
  apps: [16777311, 16777313]
  aliases: []
  description: >-
    The interface between the MTC-IWF and the SMS-SC. It submits device trigger requests for delivery
    to the UE as short messages and returns delivery reports. The SMS-IWMSC also uses it to pass
    MSISDN-less MO SMS to the MTC-IWF with the SGd application.
  spec: ["TS 23.682 §4.2", "TS 29.337"]

- id: S6c
  name: S6c
  generations: [4G]
  endpoints: [SMS-GMSC, SMS-IWMSC, SMS-Router, IP-SM-GW, HSS]
  protocol: Diameter
  apps: [16777312]
  aliases: []
  description: >-
    The interface between the HSS and the central SMS functions: the SMS-GMSC, SMS-IWMSC, and SMS
    Router, with the IP-SM-GW also reporting delivery status. It returns routing information for
    mobile-terminated SMS, records delivery failures as message waiting data, and alerts the SMS centre
    when a UE becomes reachable.
  spec: ["TS 23.272", "TS 29.338"]

- id: SGd
  name: SGd
  generations: [4G]
  endpoints: [MME, SMS-GMSC, SMS-IWMSC, SMS-Router]
  protocol: Diameter
  apps: [16777313, 16777312]
  aliases: []
  description: >-
    The interface between the MME and the SMS-GMSC, SMS-IWMSC, or an SMS Router, for SMS in MME. It
    carries mobile-originated and mobile-terminated short messages without CS fallback, and the MME
    uses it to alert the SMS-GMSC when a UE with pending MT SMS becomes available.
  spec: ["TS 23.272", "TS 29.338"]

- id: Gdd
  name: Gdd
  generations: [2G, 3G, 4G]
  endpoints: [SGSN, SMS-GMSC, SMS-IWMSC, SMS-Router]
  protocol: Diameter
  apps: [16777313, 16777312]
  aliases: []
  description: >-
    The Diameter equivalent of Gd between the SGSN and the SMS-GMSC, SMS-IWMSC, or an SMS Router. It
    carries MO and MT short messages for UEs served by the SGSN and lets the SGSN alert the SMS-GMSC.
  spec: ["TS 23.060", "TS 29.338 §6"]

# --- MBMS ---

- id: Gmb
  name: Gmb
  generations: [3G]
  endpoints: [GGSN, BM-SC]
  protocol: Diameter
  apps: [16777223]
  aliases: []
  description: >-
    The interface between the GGSN and the BM-SC. It carries MBMS user authorization and session start
    and stop for 3G broadcast and multicast.
  spec: ["TS 23.246", "TS 29.061"]

- id: SGmb
  name: SGmb
  generations: [4G]
  endpoints: [MBMS-GW, BM-SC]
  protocol: Diameter
  apps: [16777292]
  aliases: []
  description: >-
    The control interface between the BM-SC and the MBMS-GW. It carries MBMS session start, update, and
    stop for EPS broadcast.
  spec: ["TS 23.246", "TS 29.061"]

- id: SGi-mb
  name: SGi-mb
  generations: [4G]
  endpoints: [BM-SC, MBMS-GW]
  protocol: IP
  aliases: []
  description: >-
    The user-plane interface between the BM-SC and the MBMS-GW. It carries the broadcast content that
    the MBMS-GW forwards to eNodeBs.
  spec: ["TS 23.246"]

# --- 2G/3G core (MAP, GTPv1) ---

- id: Gn
  name: Gn
  generations: [2G, 3G]
  endpoints: [SGSN, GGSN]
  protocol: GTPv1-C / GTP-U
  aliases: []
  description: >-
    The interface between GPRS support nodes in the same network. It carries PDP context management and
    user data tunnels between the SGSN and GGSN, and also SGSN-to-SGSN context transfer.
  spec: ["TS 23.060", "TS 29.060"]

- id: Gp
  name: Gp
  generations: [2G, 3G]
  endpoints: [SGSN, GGSN]
  protocol: GTPv1-C / GTP-U
  aliases: []
  description: >-
    The roaming form of Gn between a visited SGSN and a home GGSN. It carries the same GTP signalling
    and user tunnels across PLMN borders.
  spec: ["TS 23.060", "TS 29.060"]

- id: Gi
  name: Gi
  generations: [2G, 3G]
  endpoints: [GGSN, DN]
  protocol: IP
  aliases: []
  description: >-
    The interface between the GGSN and an external packet data network. It carries the UE's IP traffic
    and may use RADIUS toward external AAA servers.
  spec: ["TS 23.060", "TS 29.061"]

- id: Gr
  name: Gr
  generations: [2G, 3G]
  endpoints: [SGSN, HLR]
  protocol: MAP
  aliases: []
  description: >-
    The MAP interface between the SGSN and the HLR. It carries authentication data requests, GPRS
    location updates, and subscription data insertion.
  spec: ["TS 23.060", "TS 29.002"]

- id: Gc
  name: Gc
  generations: [2G, 3G]
  endpoints: [GGSN, HLR]
  protocol: MAP
  aliases: []
  description: >-
    An optional MAP interface between the GGSN and the HLR. It lets the GGSN find the serving SGSN for
    network-requested PDP context activation.
  spec: ["TS 23.060", "TS 29.002"]

- id: Gf
  name: Gf
  generations: [2G, 3G]
  endpoints: [SGSN, EIR]
  protocol: MAP
  aliases: []
  description: >-
    The MAP interface between the SGSN and the EIR. It checks the IMEI of a device attaching to GPRS.
  spec: ["TS 23.060", "TS 29.002"]

- id: Gs
  name: Gs
  generations: [2G, 3G]
  endpoints: [SGSN, MSC]
  protocol: BSSAP+
  aliases: []
  description: >-
    An optional interface between the SGSN and the MSC/VLR. It coordinates combined GPRS and CS
    attach and location updates and lets the MSC page through the SGSN.
  spec: ["TS 23.060", "TS 29.018"]

- id: Gd
  name: Gd
  generations: [2G, 3G]
  endpoints: [SGSN, SMS-GMSC]
  protocol: MAP
  aliases: []
  description: >-
    The MAP interface between the SGSN and the SMS-GMSC or SMS-IWMSC. It carries short messages over
    GPRS.
  spec: ["TS 23.060", "TS 29.002"]

- id: B
  name: B
  generations: [2G, 3G]
  endpoints: [MSC, VLR]
  protocol: MAP
  aliases: []
  description: >-
    The interface between the MSC and its VLR. It is usually internal because the two are co-located,
    and covers access to subscriber and location data for calls.
  spec: ["TS 23.002", "TS 29.002"]

- id: C
  name: C
  generations: [2G, 3G]
  endpoints: [MSC, HLR]
  protocol: MAP
  aliases: []
  description: >-
    The MAP interface between a gateway MSC and the HLR. It obtains routing information for incoming
    calls and short messages.
  spec: ["TS 23.002", "TS 29.002"]

- id: D
  name: D
  generations: [2G, 3G]
  endpoints: [VLR, HLR]
  protocol: MAP
  aliases: []
  description: >-
    The MAP interface between the VLR and the HLR. It carries location updates, subscriber data
    insertion, authentication data requests, and cancel location.
  spec: ["TS 23.002", "TS 29.002"]

- id: E
  name: E
  generations: [2G, 3G]
  endpoints: [MSC, MSC]
  protocol: MAP
  aliases: []
  description: >-
    The MAP interface between two MSCs. It carries inter-MSC handover signalling and short message
    transfer between gateway and serving MSCs.
  spec: ["TS 23.002", "TS 29.002"]

- id: F
  name: F
  generations: [2G, 3G]
  endpoints: [MSC, EIR]
  protocol: MAP
  aliases: []
  description: >-
    The MAP interface between the MSC and the EIR. It checks the IMEI of a device using CS services.
  spec: ["TS 23.002", "TS 29.002"]

- id: G
  name: G
  generations: [2G, 3G]
  endpoints: [VLR, VLR]
  protocol: MAP
  aliases: []
  description: >-
    The MAP interface between two VLRs. A new VLR uses it to fetch the IMSI and authentication data from
    the previous VLR after a location change.
  spec: ["TS 23.002", "TS 29.002"]

# --- IMS ---

- id: Gm
  name: Gm
  generations: [IMS]
  endpoints: [UE, P-CSCF]
  protocol: SIP
  aliases: []
  description: >-
    The SIP interface between the UE and the P-CSCF. It carries registration, session setup, and other
    SIP signalling, protected by IPsec or TLS.
  spec: ["TS 23.228 §4", "TS 24.229"]

- id: Mw
  name: Mw
  generations: [IMS]
  endpoints: [P-CSCF, S-CSCF]
  protocol: SIP
  aliases: []
  description: >-
    The SIP interface between CSCFs, including P-CSCF to I-CSCF and I-CSCF to S-CSCF. It carries
    registration and session signalling through the IMS core.
  spec: ["TS 23.228 §4", "TS 24.229"]

- id: Cx
  name: Cx
  generations: [IMS]
  endpoints: [S-CSCF, HSS]
  protocol: Diameter
  apps: [16777216]
  aliases: []
  description: >-
    The interface between the I-CSCF or S-CSCF and the HSS. It carries S-CSCF assignment queries,
    authentication vector requests, and user profile download at registration.
  spec: ["TS 23.228 §4", "TS 29.228"]

- id: Dx
  name: Dx
  generations: [IMS]
  endpoints: [S-CSCF, SLF]
  protocol: Diameter
  apps: [16777216]
  aliases: []
  description: >-
    The interface between a CSCF and the SLF. It returns the HSS that holds a given user's data in
    networks with several HSSs.
  spec: ["TS 23.228 §4", "TS 29.228"]

- id: Sh
  name: Sh
  generations: [IMS]
  endpoints: [AS, HSS]
  protocol: Diameter
  apps: [16777217]
  aliases: []
  description: >-
    The interface between an IMS application server and the HSS. It reads and updates transparent and
    service data for a user and subscribes to data change notifications.
  spec: ["TS 23.228 §4", "TS 29.328"]

- id: Dh
  name: Dh
  generations: [IMS]
  endpoints: [AS, SLF]
  protocol: Diameter
  apps: [16777217]
  aliases: []
  description: >-
    The interface between an application server and the SLF. It locates the HSS that holds a user's
    data before the AS uses Sh.
  spec: ["TS 23.228 §4", "TS 29.328"]

- id: ISC
  name: ISC
  generations: [IMS]
  endpoints: [S-CSCF, AS]
  protocol: SIP
  aliases: []
  description: >-
    The SIP interface between the S-CSCF and an application server. The S-CSCF sends requests to the AS
    when initial filter criteria match, so the AS can provide its service.
  spec: ["TS 23.228 §4", "TS 24.229"]

- id: Ma
  name: Ma
  generations: [IMS]
  endpoints: [I-CSCF, AS]
  protocol: SIP
  aliases: []
  description: >-
    The SIP interface between the I-CSCF and an application server. It routes requests addressed to a
    public service identity hosted directly by the AS.
  spec: ["TS 23.228 §4", "TS 24.229"]

- id: Ut
  name: Ut
  generations: [IMS]
  endpoints: [UE, AS]
  protocol: XCAP over HTTP
  aliases: []
  description: >-
    The interface between the UE and an application server for service settings. The UE reads and
    changes configuration such as call forwarding using XCAP, often authenticated with GBA.
  spec: ["TS 23.228 §4", "TS 24.623"]

- id: Mg
  name: Mg
  generations: [IMS]
  endpoints: [MGCF, I-CSCF]
  protocol: SIP
  aliases: []
  description: >-
    The SIP interface between the MGCF and a CSCF. It carries sessions arriving from the CS network into
    IMS.
  spec: ["TS 23.228 §4", "TS 24.229"]

- id: Mi
  name: Mi
  generations: [IMS]
  endpoints: [S-CSCF, BGCF]
  protocol: SIP
  aliases: []
  description: >-
    The SIP interface between a CSCF and the BGCF. The S-CSCF uses it to hand off sessions that must
    break out to the CS network.
  spec: ["TS 23.228 §4", "TS 24.229"]

- id: Mj
  name: Mj
  generations: [IMS]
  endpoints: [BGCF, MGCF]
  protocol: SIP
  aliases: []
  description: >-
    The SIP interface between the BGCF and an MGCF in the same network. It forwards sessions that the
    BGCF has chosen to break out locally.
  spec: ["TS 23.228 §4", "TS 24.229"]

- id: Mk
  name: Mk
  generations: [IMS]
  endpoints: [BGCF, BGCF]
  protocol: SIP
  aliases: []
  description: >-
    The SIP interface between BGCFs in different networks. It forwards sessions that should break out
    in another network.
  spec: ["TS 23.228 §4", "TS 24.229"]

- id: Mr
  name: Mr
  generations: [IMS]
  endpoints: [S-CSCF, MRFC]
  protocol: SIP
  aliases: []
  description: >-
    The SIP interface between the S-CSCF and the MRFC. It requests media resources such as
    announcements or conferences.
  spec: ["TS 23.228 §4", "TS 24.229"]

- id: Mrp
  name: Mr'
  generations: [IMS]
  endpoints: [AS, MRFC]
  protocol: SIP
  aliases: []
  description: >-
    The SIP interface between an application server and the MRFC. The AS requests media resources
    directly, without going through the S-CSCF.
  spec: ["TS 23.228 §4", "TS 24.229"]

- id: Mp
  name: Mp
  generations: [IMS]
  endpoints: [MRFC, MRFP]
  protocol: H.248
  aliases: []
  description: >-
    The media control interface between the MRFC and the MRFP. It allocates and controls media streams
    for playing, recording, and mixing.
  spec: ["TS 23.228 §4", "TS 29.333"]

- id: Mn
  name: Mn
  generations: [IMS]
  endpoints: [MGCF, IMS-MGW]
  protocol: H.248
  aliases: []
  description: >-
    The media gateway control interface between the MGCF and the IMS-MGW. It sets up the bearer and
    codec conversion between IMS and CS media.
  spec: ["TS 23.228 §4", "TS 29.332"]

- id: Mx
  name: Mx
  generations: [IMS]
  endpoints: [S-CSCF, IBCF]
  protocol: SIP
  aliases: []
  description: >-
    The SIP interface between a CSCF or BGCF and the IBCF. It routes sessions to and from the network
    border for interconnection with other IMS networks.
  spec: ["TS 23.228 §4", "TS 24.229"]

- id: Ici
  name: Ici
  generations: [IMS]
  endpoints: [IBCF, IBCF]
  protocol: SIP
  aliases: []
  description: >-
    The SIP interconnect between IBCFs of two IMS networks. It carries inter-operator session signalling.
  spec: ["TS 23.228 §4", "TS 29.165"]

- id: Zh
  name: Zh
  generations: [3G, 4G, IMS]
  endpoints: [GBA-BSF, HSS]
  protocol: Diameter
  apps: [16777221]
  aliases: []
  description: >-
    The interface between the GBA bootstrapping server and the HSS. It fetches authentication vectors
    and GBA user security settings for bootstrapping.
  spec: ["TS 33.220", "TS 29.109"]

- id: Zn
  name: Zn
  generations: [3G, 4G, IMS]
  endpoints: [NAF, GBA-BSF]
  protocol: Diameter
  apps: [16777220]
  aliases: []
  description: >-
    The interface between a NAF and the BSF. The NAF presents a bootstrapping transaction identifier and
    receives the application-specific key for that UE; an HTTP variant also exists.
  spec: ["TS 33.220", "TS 29.109"]

- id: Ub
  name: Ub
  generations: [3G, 4G, IMS]
  endpoints: [UE, GBA-BSF]
  protocol: HTTP Digest AKA
  aliases: []
  description: >-
    The interface between the UE and the BSF. It runs AKA over HTTP to create the shared GBA key and
    transaction identifier.
  spec: ["TS 33.220", "TS 24.109"]

- id: Ua
  name: Ua
  generations: [3G, 4G, IMS]
  endpoints: [UE, NAF]
  protocol: HTTP
  aliases: []
  description: >-
    The application interface between the UE and a NAF, secured with keys derived from GBA
    bootstrapping.
  spec: ["TS 33.220", "TS 24.109"]

# --- 5GC (TS 23.501) ---

- id: NR-Uu
  name: NR-Uu
  generations: [5G]
  endpoints: [UE, gNB]
  protocol: NR RRC
  aliases: [Uu]
  description: >-
    The NR air interface. It carries RRC signalling with the gNB and user data on data radio bearers,
    with NAS carried transparently toward the AMF.
  spec: ["TS 23.501 §4.2", "TS 38.331"]

- id: Xn
  name: Xn
  generations: [5G]
  endpoints: [gNB, gNB]
  protocol: XnAP / GTP-U
  aliases: []
  description: >-
    The interface between NG-RAN nodes. It carries handover preparation, dual connectivity, and RAN
    paging signalling, and forwards user data during mobility.
  spec: ["TS 23.501 §4.2", "TS 38.423"]

- id: N1
  name: N1
  generations: [5G]
  endpoints: [UE, AMF]
  protocol: 5GS NAS
  aliases: []
  description: >-
    The NAS reference point between the UE and the AMF. It carries registration, mobility, and security
    procedures, and transports session management and SMS messages that the AMF relays to the SMF or
    SMSF.
  spec: ["TS 23.501 §4.2.7", "TS 24.501"]

- id: N2
  name: N2
  generations: [5G]
  endpoints: [gNB, AMF]
  protocol: NGAP
  aliases: [NG-C]
  description: >-
    The control reference point between the access network and the AMF. It carries UE context and PDU
    session resource setup, paging, handover, and NAS transport.
  spec: ["TS 23.501 §4.2.7", "TS 38.413"]

- id: N3
  name: N3
  generations: [5G]
  endpoints: [gNB, UPF]
  protocol: GTP-U
  aliases: [NG-U]
  description: >-
    The user-plane reference point between the access network and the UPF. It carries per-PDU-session
    GTP-U tunnels with QoS flow marking.
  spec: ["TS 23.501 §4.2.7", "TS 29.281"]

- id: N4
  name: N4
  generations: [5G]
  endpoints: [SMF, UPF]
  protocol: PFCP
  aliases: []
  description: >-
    The reference point between the SMF and the UPF. The SMF installs packet detection, forwarding, QoS,
    and usage reporting rules, and the UPF reports usage and events.
  spec: ["TS 23.501 §4.2.7", "TS 29.244"]

- id: N6
  name: N6
  generations: [5G]
  endpoints: [UPF, DN]
  protocol: IP
  aliases: []
  description: >-
    The reference point between the UPF and a data network. It carries the UE's IP, Ethernet, or
    unstructured traffic to and from the DN.
  spec: ["TS 23.501 §4.2.7"]

- id: N9
  name: N9
  generations: [5G]
  endpoints: [UPF, UPF]
  protocol: GTP-U
  aliases: []
  description: >-
    The user-plane reference point between two UPFs, for example an intermediate UPF and a PDU session
    anchor, or visited and home UPFs in roaming.
  spec: ["TS 23.501 §4.2.7", "TS 29.281"]

- id: N5
  name: N5
  generations: [5G]
  endpoints: [AF, PCF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between an application function and the PCF. It uses Npcf_PolicyAuthorization
    so the AF can request QoS for its sessions and subscribe to bearer events.
  spec: ["TS 23.501 §4.2.7", "TS 29.514"]

- id: N7
  name: N7
  generations: [5G]
  endpoints: [SMF, PCF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the SMF and the PCF. It uses Npcf_SMPolicyControl to provide session
    management policy and PCC rules for PDU sessions.
  spec: ["TS 23.501 §4.2.7", "TS 29.512"]

- id: N8
  name: N8
  generations: [5G]
  endpoints: [AMF, UDM]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the UDM. It uses Nudm_UECM to register the serving AMF and
    Nudm_SDM to fetch access and mobility subscription data.
  spec: ["TS 23.501 §4.2.7", "TS 29.503"]

- id: N10
  name: N10
  generations: [5G]
  endpoints: [SMF, UDM]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the SMF and the UDM. It uses Nudm_UECM to register the SMF for a PDU
    session and Nudm_SDM to read session management subscription data.
  spec: ["TS 23.501 §4.2.7", "TS 29.503"]

- id: N11
  name: N11
  generations: [5G]
  endpoints: [AMF, SMF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the SMF. It uses Nsmf_PDUSession to create and update PDU
    sessions and Namf_Communication to pass N1 and N2 messages.
  spec: ["TS 23.501 §4.2.7", "TS 29.502"]

- id: N12
  name: N12
  generations: [5G]
  endpoints: [AMF, AUSF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the AUSF. It uses Nausf_UEAuthentication to run primary
    authentication of the UE.
  spec: ["TS 23.501 §4.2.7", "TS 29.509"]

- id: N13
  name: N13
  generations: [5G]
  endpoints: [AUSF, UDM]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AUSF and the UDM. It uses Nudm_UEAuthentication to obtain
    authentication vectors and report authentication results.
  spec: ["TS 23.501 §4.2.7", "TS 29.503"]

- id: N14
  name: N14
  generations: [5G]
  endpoints: [AMF, AMF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between two AMFs. It uses Namf_Communication to transfer UE context during AMF
    change.
  spec: ["TS 23.501 §4.2.7", "TS 29.518"]

- id: N15
  name: N15
  generations: [5G]
  endpoints: [AMF, PCF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the PCF. It uses Npcf_AMPolicyControl and
    Npcf_UEPolicyControl to deliver access and mobility policy and UE route selection policy.
  spec: ["TS 23.501 §4.2.7", "TS 29.507"]

- id: N16
  name: N16
  generations: [5G]
  endpoints: [SMF, SMF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between SMFs, such as a visited and a home SMF in home-routed roaming. It uses
    Nsmf_PDUSession to manage the session across both.
  spec: ["TS 23.501 §4.2.7", "TS 29.502"]

- id: N17
  name: N17
  generations: [5G]
  endpoints: [AMF, 5G-EIR]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the 5G-EIR. It uses N5g-eir_EquipmentIdentityCheck to verify
    the device PEI.
  spec: ["TS 23.501 §4.2.7", "TS 29.511"]

- id: N18
  name: N18
  generations: [5G]
  endpoints: [AMF, UDSF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between any NF and the UDSF. It uses Nudsf_DataRepository to store and retrieve
    unstructured context data; the AMF is shown here as a typical client.
  spec: ["TS 23.501 §4.2.7", "TS 29.598"]

- id: N19
  name: N19
  generations: [5G]
  endpoints: [UPF, UPF]
  protocol: GTP-U
  aliases: []
  description: >-
    The reference point between two PDU session anchor UPFs used for local switching in 5G LAN-type
    services. It carries tunnelled user traffic between members of the same group.
  spec: ["TS 23.501 §4.2.7"]

- id: N20
  name: N20
  generations: [5G]
  endpoints: [AMF, SMSF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the SMSF. It uses Nsmsf_SMService to activate SMS for a UE
    and relay SMS carried in NAS.
  spec: ["TS 23.501 §4.2.7", "TS 29.540"]

- id: N21
  name: N21
  generations: [5G]
  endpoints: [SMSF, UDM]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the SMSF and the UDM. It uses Nudm_UECM to register the SMSF and
    Nudm_SDM to fetch SMS subscription data.
  spec: ["TS 23.501 §4.2.7", "TS 29.503"]

- id: N22
  name: N22
  generations: [5G]
  endpoints: [AMF, NSSF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the NSSF. It uses Nnssf_NSSelection to determine the allowed
    NSSAI and the target AMF set for a UE.
  spec: ["TS 23.501 §4.2.7", "TS 29.531"]

- id: N23
  name: N23
  generations: [5G]
  endpoints: [PCF, NWDAF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the PCF and the NWDAF. It uses Nnwdaf_AnalyticsInfo and
    Nnwdaf_AnalyticsSubscription so the PCF can base policy on analytics.
  spec: ["TS 23.501 §4.2.7", "TS 29.520"]

- id: N24
  name: N24
  generations: [5G]
  endpoints: [PCF, PCF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between a visited and a home PCF in roaming. It carries access, mobility, and UE
    policy between the two networks.
  spec: ["TS 23.501 §4.2.7", "TS 29.507"]

- id: N26
  name: N26
  generations: [4G, 5G]
  endpoints: [MME, AMF]
  protocol: GTPv2-C
  aliases: []
  description: >-
    The interworking reference point between the MME and the AMF. It transfers UE context during
    handover and idle-mode mobility between EPS and 5GS.
  spec: ["TS 23.501 §4.3", "TS 29.274"]

- id: N27
  name: N27
  generations: [5G]
  endpoints: [NRF, NRF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between NRFs in visited and home networks. It uses Nnrf_NFDiscovery and
    Nnrf_AccessToken to discover NFs and obtain tokens across PLMNs.
  spec: ["TS 23.501 §4.2.7", "TS 29.510"]

- id: N28
  name: N28
  generations: [5G]
  endpoints: [PCF, CHF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the PCF and the CHF. It uses Nchf_SpendingLimitControl to subscribe to
    the status of spending limit counters.
  spec: ["TS 23.501 §4.2.7", "TS 29.594"]

- id: N29
  name: N29
  generations: [5G]
  endpoints: [NEF, SMF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the NEF and the SMF. It uses Nsmf_NIDD to carry non-IP data between an
    application and the UE.
  spec: ["TS 23.501 §4.2.7", "TS 29.542"]

- id: N30
  name: N30
  generations: [5G]
  endpoints: [NEF, PCF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the NEF and the PCF. It uses Npcf_PolicyAuthorization and
    Npcf_BDTPolicyControl so external applications can influence QoS and background data transfer.
  spec: ["TS 23.501 §4.2.7", "TS 29.514"]

- id: N31
  name: N31
  generations: [5G]
  endpoints: [NSSF, NSSF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between NSSFs in visited and home networks. It uses Nnssf_NSSelection to map
    slices across PLMNs for roaming UEs.
  spec: ["TS 23.501 §4.2.7", "TS 29.531"]

- id: N32
  name: N32
  generations: [5G]
  endpoints: [SEPP, SEPP]
  protocol: HTTP/2 (N32-c/N32-f)
  aliases: []
  description: >-
    The reference point between SEPPs of two PLMNs. N32-c negotiates security capabilities and N32-f
    forwards protected service-based messages between the networks.
  spec: ["TS 23.501 §4.2.7", "TS 29.573"]

- id: N33
  name: N33
  generations: [5G]
  endpoints: [NEF, AF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the NEF and external application functions. It exposes northbound APIs
    such as event monitoring, traffic influence, and parameter provisioning.
  spec: ["TS 23.501 §4.2.7", "TS 29.522"]

- id: N34
  name: N34
  generations: [5G]
  endpoints: [NSSF, NWDAF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the NSSF and the NWDAF. It lets the NSSF use slice load analytics when
    selecting slices.
  spec: ["TS 23.501 §4.2.7", "TS 29.520"]

- id: N35
  name: N35
  generations: [5G]
  endpoints: [UDM, UDR]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the UDM and the UDR. It uses Nudr_DataRepository to read and write
    subscription data.
  spec: ["TS 23.501 §4.2.7", "TS 29.504"]

- id: N36
  name: N36
  generations: [5G]
  endpoints: [PCF, UDR]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the PCF and the UDR. It uses Nudr_DataRepository to read policy and
    application data and subscribe to changes.
  spec: ["TS 23.501 §4.2.7", "TS 29.504"]

- id: N37
  name: N37
  generations: [5G]
  endpoints: [NEF, UDR]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the NEF and the UDR. It uses Nudr_DataRepository to store and read
    exposure and application data.
  spec: ["TS 23.501 §4.2.7", "TS 29.504"]

- id: N40
  name: N40
  generations: [5G]
  endpoints: [SMF, CHF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the SMF and the CHF. It uses Nchf_ConvergedCharging to report usage and
    request quota for PDU sessions.
  spec: ["TS 23.501 §4.2.7", "TS 32.291"]

- id: N50
  name: N50
  generations: [5G]
  endpoints: [AMF, CBC]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the CBCF. It uses Namf_Communication to deliver public
    warning messages for broadcast in NG-RAN.
  spec: ["TS 23.501 §4.2.7", "TS 23.041"]

- id: N51
  name: N51
  generations: [5G]
  endpoints: [AMF, NEF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the NEF. It uses Namf_EventExposure so the NEF can monitor
    UE events such as reachability and location.
  spec: ["TS 23.501 §4.2.7", "TS 29.518"]

- id: N52
  name: N52
  generations: [5G]
  endpoints: [NEF, UDM]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the NEF and the UDM. It uses Nudm_EventExposure and
    Nudm_ParameterProvision to set up monitoring and provision UE parameters.
  spec: ["TS 23.501 §4.2.7", "TS 29.503"]

- id: N58
  name: N58
  generations: [5G]
  endpoints: [AMF, NSSAAF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the NSSAAF. It uses Nnssaaf_NSSAA to run slice-specific
    authentication of the UE.
  spec: ["TS 23.501 §4.2.7", "TS 29.526"]

- id: N59
  name: N59
  generations: [5G]
  endpoints: [UDM, NSSAAF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the UDM and the NSSAAF. It supports slice authentication procedures that
    need subscription data.
  spec: ["TS 23.501 §4.2.7"]

- id: NWu
  name: NWu
  generations: [5G]
  endpoints: [UE, N3IWF]
  protocol: IKEv2/IPsec
  aliases: []
  description: >-
    The reference point between the UE and the N3IWF over untrusted non-3GPP access. It sets up IPsec
    tunnels for NAS signalling and for user-plane traffic.
  spec: ["TS 23.501 §4.2.7", "TS 24.502"]

- id: NWt
  name: NWt
  generations: [5G]
  endpoints: [UE, TNGF]
  protocol: IKEv2/IPsec
  aliases: []
  description: >-
    The reference point between the UE and the TNGF over trusted non-3GPP access. It carries NAS and user
    traffic inside IPsec security associations.
  spec: ["TS 23.501 §4.2.7", "TS 24.502"]

- id: NLs
  name: NLs
  generations: [5G]
  endpoints: [AMF, LMF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the LMF. It uses Nlmf_Location for positioning requests and
    Namf_Communication to carry positioning messages to the UE and NG-RAN.
  spec: ["TS 23.273", "TS 29.572"]

- id: NLg
  name: NLg
  generations: [5G]
  endpoints: [AMF, GMLC]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the GMLC and the AMF. It uses Namf_Location to request a UE's location
    and receive location event reports.
  spec: ["TS 23.273", "TS 29.518"]

- id: NLh
  name: NLh
  generations: [5G]
  endpoints: [GMLC, UDM]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the GMLC and the UDM. It returns the serving AMF and location privacy
    settings for a UE.
  spec: ["TS 23.273", "TS 29.503"]

# --- Further reference points from TS 23.002 and TS 23.401 ---

- id: S17
  name: S17
  generations: [4G]
  endpoints: [MME, UCMF]
  protocol: URCMP or HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the MME and the UCMF for radio capability signalling optimisation
    (RACS). The MME uses it to resolve UE Radio Capability IDs to full capability sets and to have the
    UCMF assign PLMN IDs for new capability sets.
  spec: ["TS 23.401 §4.2.3", "TS 29.674"]

- id: Iuh
  name: Iuh
  generations: [3G]
  endpoints: [HNB, HNB-GW]
  protocol: HNBAP / RUA
  aliases: []
  description: >-
    The interface between a Home NodeB and its HNB gateway, usually carried over the public internet. It
    handles HNB and UE registration and relays RANAP signalling and user data toward the core.
  spec: ["TS 23.002 §6.3.5", "TS 25.469", "TS 25.468"]

- id: Mc
  name: Mc
  generations: [3G]
  endpoints: [MSC, CS-MGW]
  protocol: H.248
  aliases: []
  description: >-
    The gateway control interface between an MSC Server or GMSC Server and a CS-MGW. The server uses it
    to set up terminations, bearers, and media processing in the gateway, including anchoring during
    handover and relocation.
  spec: ["TS 23.002 §6.4.1.7"]

- id: Nc
  name: Nc
  generations: [3G]
  endpoints: [MSC, GMSC]
  protocol: BICC / ISUP
  aliases: []
  description: >-
    The call control interface between MSC Servers and GMSC Servers in a split CS core. It carries
    network-to-network call signalling such as ISUP or bearer independent call control, over IP or SS7
    transport.
  spec: ["TS 23.002 §6.4.1.8"]

- id: Nb
  name: Nb
  generations: [3G]
  endpoints: [CS-MGW, CS-MGW]
  protocol: RTP / AAL2
  aliases: []
  description: >-
    The user plane between two CS-MGWs in a split CS core. It carries the voice and data bearers and
    their bearer control, using RTP over IP or AAL2 over ATM.
  spec: ["TS 23.002 §6.4.1.9"]

- id: Hv
  name: Hv
  generations: [3G]
  endpoints: [VLR, CSS]
  protocol: MAP
  aliases: []
  description: >-
    The reference point between the VLR and the CSS in the visited network. The CSS uses it to give the
    VLR the CSG subscription data it holds for roaming users so they can use CS services in CSG cells.
  spec: ["TS 23.002 §6.4.1.10", "TS 29.002"]

- id: Ghv
  name: Ghv
  generations: [3G]
  endpoints: [SGSN, CSS]
  protocol: MAP
  aliases: []
  description: >-
    The reference point between a Gn/Gp SGSN and the CSS in the visited network. It transfers the CSG
    subscription data held in the VPLMN for roaming users to the SGSN.
  spec: ["TS 23.002 §6.4.2.5", "TS 29.002"]

- id: H
  name: H
  generations: [2G, 3G]
  endpoints: [HLR, AuC]
  protocol: Not standardised
  aliases: []
  description: >-
    The internal link between the HLR or HSS and the Authentication Centre. The HLR requests
    authentication and ciphering vectors from the AuC when it holds none for a subscriber.
  spec: ["TS 23.002 §6.4.3.2"]

- id: S14
  name: S14
  generations: [4G]
  endpoints: [UE, ANDSF]
  protocol: OMA DM
  aliases: []
  description: >-
    The reference point between the UE and the ANDSF, carried over IP. The UE pulls, or the ANDSF
    pushes, access network discovery information and inter-system mobility and routing policies for
    non-3GPP accesses such as WLAN.
  spec: ["TS 23.002 §6.4.4.21", "TS 24.302"]

- id: S101
  name: S101
  generations: [4G]
  endpoints: [MME, HRPD-AN]
  protocol: S101-AP
  aliases: []
  description: >-
    The reference point between the MME and a 3GPP2 HRPD access network. It tunnels HRPD signalling for
    a UE on E-UTRAN, supporting pre-registration, session maintenance, and active handover to HRPD.
  spec: ["TS 23.002 §6.4.4.22"]

- id: S102
  name: S102
  generations: [4G]
  endpoints: [MME, 1xCS-IWS]
  protocol: S102 (A21 messages)
  aliases: []
  description: >-
    The tunnel between the MME and a 3GPP2 1xCS interworking solution. It relays 1xRTT CS signalling for
    SRVCC and CS fallback to CDMA2000 1x circuit-switched networks.
  spec: ["TS 23.002 §6.4.4.23"]

- id: S103
  name: S103
  generations: [4G]
  endpoints: [SGW, HSGW]
  protocol: GTP-U
  aliases: []
  description: >-
    The user plane interface between the Serving GW and the HRPD Serving Gateway. It forwards downlink
    data during handover from E-UTRAN to HRPD, using tunnels set up through S101 signalling.
  spec: ["TS 23.002 §6.4.4.24"]

- id: Uh
  name: Uh
  generations: [3G, 4G]
  endpoints: [UE, CSG-List-Server]
  protocol: OMA DM / OTA
  aliases: []
  description: >-
    The reference point between the UE and the CSG List Server. It provisions the Allowed CSG list and
    the Operator CSG list on the UE, either by OMA DM or by OTA updates to the USIM.
  spec: ["TS 23.002 §6.4.4.25", "TS 24.285", "TS 31.102"]

- id: S7d
  name: S7d
  generations: [3G]
  endpoints: [SGSN, CSS]
  protocol: Diameter
  aliases: []
  description: >-
    The interface between an S4-SGSN and the CSS in the visited network. The CSS provides, and updates,
    the CSG subscription data it holds for roaming users.
  spec: ["TS 23.002 §6.4.4.26", "TS 29.272"]

- id: S7a
  name: S7a
  generations: [4G]
  endpoints: [MME, CSS]
  protocol: Diameter
  aliases: []
  description: >-
    The interface between the MME and the CSS in the visited network. The CSS provides, and updates, the
    CSG subscription data it holds for roaming users so the MME can control access to CSG cells.
  spec: ["TS 23.002 §6.4.4.27", "TS 29.272"]

- id: S121
  name: S121
  generations: [4G]
  endpoints: [MME, HRPD-AN]
  protocol: RIM transfer
  aliases: []
  description: >-
    The reference point between the MME and a 3GPP2 HRPD access network for RAN information management.
    It relays RIM messages between eNodeBs and the HRPD access network, for example to exchange cell
    load information.
  spec: ["TS 23.002 §6.4.4.30"]

- id: I
  name: I
  generations: [2G, 3G]
  endpoints: [MSC, GCR]
  protocol: Not standardised
  aliases: []
  description: >-
    The interface between an MSC and its Group Call Register. The MSC queries the GCR for the attributes
    of a voice group or voice broadcast call, such as the cells and MSCs the call covers.
  spec: ["TS 23.002 §6a.1.1"]

- id: Lb
  name: Lb
  generations: [2G]
  endpoints: [BSC, SMLC]
  protocol: BSSAP-LE
  aliases: []
  description: >-
    The GERAN interface between the BSC and a standalone SMLC. It carries positioning requests,
    measurements, and location results for the target MS served by the BSC; in UTRAN the SMLC role sits
    in the SRNC.
  spec: ["TS 23.002 §6a.3.5", "TS 49.031"]

- id: Lp
  name: Lp
  generations: [2G]
  endpoints: [SMLC, SMLC]
  protocol: BSSAP-LE / SMLCPP
  aliases: []
  description: >-
    The GERAN interface between peer SMLCs. An SMLC uses it to reach positioning information and
    resources, such as LMUs, owned by another SMLC; in UTRAN the equivalent function runs over Iur.
  spec: ["TS 23.002 §6a.3.6", "TS 48.031"]

- id: Le
  name: Le
  generations: [2G, 3G, 4G]
  endpoints: [LCS-Client, GMLC]
  protocol: OMA MLP
  aliases: []
  description: >-
    The interface between an external LCS client and the GMLC. The client requests a target UE's
    location and receives the estimate, typically using the OMA Mobile Location Protocol or the OSA API.
  spec: ["TS 23.002 §6a.3.8"]

- id: Iupc
  name: Iupc
  generations: [3G]
  endpoints: [RNC, SAS]
  protocol: PCAP
  aliases: []
  description: >-
    The UTRAN interface between the SRNC and a Stand-Alone SMLC. The SAS supplies positioning assistance
    data to the RNC and can calculate the UE's position from measurements the RNC passes on.
  spec: ["TS 23.002 §6a.3.10", "TS 25.453"]

- id: Lr
  name: Lr
  generations: [2G, 3G, 4G]
  endpoints: [GMLC, GMLC]
  protocol: OMA RLP
  aliases: []
  description: >-
    The interface between GMLCs, often across networks when the target UE is roaming. It forwards
    location requests and results between the requesting, home, and visited GMLCs.
  spec: ["TS 23.002 §6a.3.11"]

- id: Lgd
  name: Lgd
  generations: [3G]
  endpoints: [SGSN, GMLC]
  protocol: Diameter
  aliases: []
  description: >-
    The interface between the GMLC and an SGSN that supports EPS-based protocols. The GMLC sends
    location requests for a UE the SGSN serves, and the SGSN returns the location results.
  spec: ["TS 23.002 §6a.3.15", "TS 29.172"]

- id: Ge
  name: Ge
  generations: [2G, 3G]
  endpoints: [gprsSSF, gsmSCF]
  protocol: CAP
  aliases: []
  description: >-
    The CAMEL interface between the gprsSSF in the SGSN and the gsmSCF. The gprsSSF asks for
    instructions, and the gsmSCF then controls the GPRS session or PDP context, for example for prepaid
    charging.
  spec: ["TS 23.002 §6a.4.8"]

- id: Iu-BC
  name: Iu-BC
  generations: [3G]
  endpoints: [CBC, RNC]
  protocol: SABP
  aliases: [Iu_BC]
  description: >-
    The interface between the Cell Broadcast Centre and the UTRAN RNC. It carries cell broadcast
    messages and their delivery parameters, such as the cells and repetition schedule.
  spec: ["TS 23.002 §6a.5.1"]

- id: Mb
  name: Mb
  generations: [IMS]
  endpoints: [IMS-MGW, DN]
  protocol: RTP
  aliases: []
  description: >-
    The IMS media plane, carried over IP between media-handling functions such as the UE, MRFP, IMS-MGW,
    and TrGW and toward IP networks. It transports the RTP voice, video, and other media streams of IMS
    sessions.
  spec: ["TS 23.002 §6a.7.14", "TS 26.114"]

- id: Si
  name: Si
  generations: [IMS]
  endpoints: [IM-SSF, HSS]
  protocol: MAP
  aliases: []
  description: >-
    The interface between the IM-SSF and the HSS. It transfers CAMEL subscription information, including
    trigger data, so CAMEL-based services can run for IMS sessions; the same data can also travel over
    Sh.
  spec: ["TS 23.002 §6a.7.17"]

- id: Ix
  name: Ix
  generations: [IMS]
  endpoints: [IBCF, TrGW]
  protocol: H.248
  aliases: []
  description: >-
    The gateway control interface between the IBCF and the TrGW at an IMS network border. The IBCF uses
    it to request address and port translation bindings and IPv4/IPv6 conversion for session media.
  spec: ["TS 23.002 §6a.7.21"]

- id: Iq
  name: Iq
  generations: [IMS]
  endpoints: [P-CSCF, IMS-AGW]
  protocol: H.248
  aliases: []
  description: >-
    The gateway control interface between the P-CSCF and the IMS Access Gateway. The P-CSCF uses it to
    allocate and release media transport addresses and to set policing and NAT traversal for each flow.
  spec: ["TS 23.002 §6a.7.23"]

- id: Izi
  name: Izi
  generations: [IMS]
  endpoints: [TrGW, TrGW]
  protocol: RTP
  aliases: []
  description: >-
    The media path between TrGWs that belong to different IMS networks. It forwards the RTP media
    streams of sessions that cross an IMS-to-IMS interconnect, after address and protocol translation.
  spec: ["TS 23.002 §6a.7.25"]

- id: I2
  name: I2
  generations: [IMS]
  endpoints: [MSC, S-CSCF]
  protocol: SIP
  aliases: []
  description: >-
    The reference point between an MSC Server and the IMS CSCFs, usable across operators. It routes SIP
    session control for an MSC Server enhanced for ICS or SRVCC, including mid-call and alerting-phase
    transfer.
  spec: ["TS 23.002 §6a.7.27"]

- id: I3
  name: I3
  generations: [IMS]
  endpoints: [MSC, AS]
  protocol: SIP / XCAP
  aliases: []
  description: >-
    The reference point between an MSC Server enhanced for ICS and the telephony application server. It
    interworks CS supplementary service signalling and service setting procedures with the TAS.
  spec: ["TS 23.002 §6a.7.28"]

- id: I1
  name: I1
  generations: [IMS]
  endpoints: [UE, AS]
  protocol: I1 over CS (USSD)
  aliases: []
  description: >-
    The reference point between an ICS UE and the SCC AS. It carries IMS service control signalling
    while the UE uses CS access for the call bearer.
  spec: ["TS 23.002 §6a.7.29"]

- id: Ms
  name: Ms
  generations: [IMS]
  endpoints: [IBCF, AS]
  protocol: SIP
  aliases: []
  description: >-
    The reference point between an IBCF and an application server. The IBCF uses it for caller identity
    attestation, identity signing, and signature verification on calls crossing the network border.
  spec: ["TS 23.002 §6a.7.30"]

- id: Wa
  name: Wa
  generations: [3G]
  endpoints: [WLAN-AN, AAA-Server]
  protocol: RADIUS / Diameter
  aliases: []
  description: >-
    The I-WLAN reference point between a WLAN access network and the 3GPP AAA Proxy or Server. It
    carries authentication, authorization, and charging data for WLAN access.
  spec: ["TS 23.002 §6a.9.2"]

- id: Wd
  name: Wd
  generations: [3G]
  endpoints: [AAA-Proxy, AAA-Server]
  protocol: RADIUS / Diameter
  aliases: []
  description: >-
    The I-WLAN roaming reference point between the visited 3GPP AAA Proxy and the home 3GPP AAA Server.
    It relays authentication, authorization, and related information for roaming WLAN users.
  spec: ["TS 23.002 §6a.9.3"]

- id: Wg
  name: Wg
  generations: [3G]
  endpoints: [WAG, AAA-Server]
  protocol: Diameter
  aliases: []
  description: >-
    The I-WLAN reference point between the 3GPP AAA Server or Proxy and the WAG. It gives the WAG the
    policy enforcement information for authorised users and returns per-tunnel charging data when
    roaming.
  spec: ["TS 23.002 §6a.9.4"]

- id: Wi
  name: Wi
  generations: [3G]
  endpoints: [PDG, DN]
  protocol: IP
  aliases: []
  description: >-
    The I-WLAN reference point between the PDG and a packet data network. The network can be an external
    public or private network or an operator network, for example for IMS services.
  spec: ["TS 23.002 §6a.9.5"]

- id: Wm
  name: Wm
  generations: [3G]
  endpoints: [PDG, AAA-Server]
  protocol: Diameter
  aliases: []
  description: >-
    The I-WLAN reference point between the 3GPP AAA Server or Proxy and the PDG. It carries service
    authentication and authorization, tunnel authentication data, and tunnelling attributes and IP
    configuration for the WLAN UE.
  spec: ["TS 23.002 §6a.9.6"]

- id: Wn
  name: Wn
  generations: [3G]
  endpoints: [WLAN-AN, WAG]
  protocol: IP
  aliases: []
  description: >-
    The I-WLAN reference point between the WLAN access network and the WAG. It forces traffic between a
    WLAN UE and the PDG to pass through the WAG.
  spec: ["TS 23.002 §6a.9.7"]

- id: Wp
  name: Wp
  generations: [3G]
  endpoints: [WAG, PDG]
  protocol: IP
  aliases: []
  description: >-
    The I-WLAN reference point between the WAG and the PDG. It transports the tunnelled Wu packets
    between the WLAN UE and the PDG, so the WAG can enforce policy on them.
  spec: ["TS 23.002 §6a.9.8"]

- id: Wu
  name: Wu
  generations: [3G]
  endpoints: [UE, PDG]
  protocol: IKEv2/IPsec
  aliases: []
  description: >-
    The I-WLAN reference point between the WLAN UE and the PDG. The UE uses it to set up a tunnel to the
    PDG and exchange packet data with 3GPP PS services through it.
  spec: ["TS 23.002 §6a.9.9"]

- id: Ww
  name: Ww
  generations: [3G]
  endpoints: [UE, WLAN-AN]
  protocol: IEEE 802.11
  aliases: []
  description: >-
    The I-WLAN reference point between the WLAN UE and the WLAN access network. Its radio and access
    protocols, such as 802.11 and 802.1X, are defined by IEEE outside 3GPP.
  spec: ["TS 23.002 §6a.9.10"]

- id: Wx
  name: Wx
  generations: [3G]
  endpoints: [AAA-Server, HSS]
  protocol: Diameter
  aliases: []
  description: >-
    The I-WLAN reference point between the 3GPP AAA Server and the HSS. The AAA Server fetches
    authentication vectors, WLAN subscriber profiles, and charging addresses, and registers itself for
    authorised WLAN users.
  spec: ["TS 23.002 §6a.9.11"]

- id: Dw
  name: Dw
  generations: [3G]
  endpoints: [AAA-Server, SLF]
  protocol: Diameter
  aliases: []
  description: >-
    The reference point between the 3GPP AAA Server and the SLF. The AAA Server uses it to find which
    HSS holds a user's data when the network has several HSSs.
  spec: ["TS 23.002 §6a.9.12"]

- id: Mz
  name: Mz
  generations: [3G, 4G]
  endpoints: [BM-SC, BM-SC]
  protocol: Diameter
  aliases: []
  description: >-
    The roaming variant of Gmb, between a BM-SC in the visited network and one in the home network. It
    carries MBMS service authorization and bearer signalling for roaming users.
  spec: ["TS 23.002 §6a.10.2", "TS 29.061"]

- id: Gmc
  name: Gmc
  generations: [3G]
  endpoints: [GGSN, RNC]
  protocol: GTP-U
  aliases: []
  description: >-
    The reference point between the GGSN and the RNS or Iu-mode BSS for MBMS. It delivers MBMS user data
    to the radio network using IP multicast.
  spec: ["TS 23.002 §6a.10.3", "TS 29.281"]

- id: Sn
  name: Sn
  generations: [3G]
  endpoints: [MBMS-GW, SGSN]
  protocol: GTPv2-C / GTP-U
  aliases: []
  description: >-
    The reference point between the MBMS-GW and an S4-SGSN. It carries MBMS session start, update, and
    stop signalling and delivers MBMS data to the SGSN in point-to-point mode.
  spec: ["TS 23.002 §6a.11.4", "TS 29.274"]

- id: M1
  name: M1
  generations: [3G, 4G]
  endpoints: [MBMS-GW, eNodeB]
  protocol: GTP-U
  aliases: []
  description: >-
    The MBMS user plane between the MBMS-GW and the E-UTRAN or UTRAN. It delivers broadcast content to
    the eNodeBs or RNCs over IP multicast with GTP-U encapsulation.
  spec: ["TS 23.002 §6a.11.5", "TS 29.281", "TS 36.445"]

- id: M3
  name: M3
  generations: [4G]
  endpoints: [MME, MCE]
  protocol: M3AP
  aliases: []
  description: >-
    The control interface between the MME and the MCE for E-UTRAN MBMS. It carries MBMS session start,
    update, and stop signalling, with the session's QoS and service area.
  spec: ["TS 23.002 §6a.11.6", "TS 36.444"]

- id: M2
  name: M2
  generations: [4G]
  endpoints: [MCE, eNodeB]
  protocol: M2AP
  aliases: []
  description: >-
    The control interface between the MCE and the eNodeBs in an MBSFN area. It carries MBMS session
    control and the radio configuration the MCE allocates for the broadcast.
  spec: ["TS 23.002 §6a.11.7", "TS 36.443"]

- id: xMB
  name: xMB
  generations: [4G]
  endpoints: [Content-Provider, BM-SC]
  protocol: HTTP (REST)
  aliases: []
  description: >-
    The reference point between a content provider and the BM-SC, either directly or through the SCEF.
    The provider uses it to create and control MBMS user services and to hand over the content to
    broadcast.
  spec: ["TS 23.002 §6a.11.8", "TS 26.346"]

- id: Rg
  name: Rg
  generations: [3G, IMS]
  endpoints: [AS, GUP-Server]
  protocol: SOAP over HTTP
  aliases: []
  description: >-
    The reference point between applications and the GUP Server. Applications use it to create, read,
    modify, and delete Generic User Profile data, and the GUP Server locates the repositories that hold
    it.
  spec: ["TS 23.002 §6a.12.1"]

- id: Rp
  name: Rp
  generations: [3G, IMS]
  endpoints: [GUP-Server, HSS]
  protocol: Not specified
  aliases: []
  description: >-
    The reference point from the GUP Server, or from applications, to GUP data repositories such as the
    HSS. It gives access to the stored user profile components, including IMS user data.
  spec: ["TS 23.002 §6a.12.2"]

- id: Sp
  name: Sp
  generations: [4G]
  endpoints: [PCRF, SPR]
  protocol: Not specified
  aliases: []
  description: >-
    The reference point between the PCRF and the Subscription Profile Repository. The PCRF fetches
    subscription data for policy decisions, and the SPR can notify it when that data changes.
  spec: ["TS 23.002 §6a.13.3"]

- id: Gxb
  name: Gxb
  generations: [4G]
  endpoints: [ePDG, PCRF]
  protocol: Diameter
  aliases: [Gxb*]
  description: >-
    The reference point between the ePDG and the PCRF or visited PCRF; only the Gxb* variant for fixed
    broadband interworking is specified. It reports WLAN access information such as the UE's local IP
    address and UDP port.
  spec: ["TS 23.002 §6a.13.7", "TS 29.212"]

- id: Gxx
  name: Gxx
  generations: [4G]
  endpoints: [BBERF, PCRF]
  protocol: Diameter
  aliases: []
  description: >-
    The generic name for the policy interface between the PCRF and a BBERF, covering Gxa and Gxc. The
    PCRF uses it to install QoS rules and control bearer binding and event reporting in the access
    gateway.
  spec: ["TS 23.002 §6a.13.9", "TS 29.213"]

- id: Ud
  name: Ud
  generations: [3G, 4G, IMS]
  endpoints: [AFE, UDR]
  protocol: LDAP / SOAP
  aliases: []
  description: >-
    The reference point between application front ends, such as HLR, HSS, or AS front ends, and the UDR
    in a User Data Convergence architecture. Front ends, including a PCRF acting as one, read and update
    user data and subscribe to change notifications.
  spec: ["TS 23.002 §6a.13.11", "TS 23.002 §6a.15.1", "TS 29.335"]

- id: S15
  name: S15
  generations: [3G]
  endpoints: [HNB-GW, PCRF]
  protocol: Diameter
  aliases: []
  description: >-
    The reference point between the HNB-GW and the PCRF for fixed broadband interworking. It sets up,
    modifies, and ends sessions so the PCRF can request fixed network resources for HNB CS calls.
  spec: ["TS 23.002 §6a.13.14", "TS 29.212"]

- id: S9a
  name: S9a
  generations: [4G]
  endpoints: [BPCF, PCRF]
  protocol: Diameter
  aliases: []
  description: >-
    The reference point between the PCRF and the Broadband Policy Control Function of a fixed broadband
    access network. It transfers QoS policy information from the PCRF to the BPCF.
  spec: ["TS 23.002 §6a.13.15", "TS 29.215"]

- id: Gyn
  name: Gyn
  generations: [4G]
  endpoints: [TDF, OCS]
  protocol: Diameter
  aliases: []
  description: >-
    The online charging interface between the TDF and the OCS. It uses Diameter credit control to
    request quota and report usage for the application traffic the TDF detects.
  spec: ["TS 23.002 §6a.13.16", "TS 32.251", "RFC 4006"]

- id: Gzn
  name: Gzn
  generations: [4G]
  endpoints: [TDF, OFCS]
  protocol: Diameter (Rf) / GTP'
  aliases: []
  description: >-
    The offline charging interface between the TDF and the OFCS. It transfers charging data and records
    for the application traffic the TDF detects, for later billing.
  spec: ["TS 23.002 §6a.13.17", "TS 32.295"]

- id: Gw
  name: Gw
  generations: [4G]
  endpoints: [PCEF, PFDF]
  protocol: Diameter
  aliases: []
  description: >-
    The reference point between the PFDF and the PCEF. The PFDF provides the Packet Flow Descriptions
    that third parties manage, so the PCEF can detect their application traffic.
  spec: ["TS 23.002 §6a.13.20"]

- id: Gwn
  name: Gwn
  generations: [4G]
  endpoints: [TDF, PFDF]
  protocol: Diameter
  aliases: []
  description: >-
    The reference point between the PFDF and the TDF. The PFDF provides the Packet Flow Descriptions
    that third parties manage, so the TDF can detect their application traffic.
  spec: ["TS 23.002 §6a.13.21"]

- id: J
  name: J
  generations: [IMS]
  endpoints: [IP-SM-GW, HSS]
  protocol: MAP
  aliases: []
  description: >-
    The reference point between the IP-SM-GW and the HSS for SMS over IP. The IP-SM-GW uses it to
    register as the user's serving node for SMS and to fetch routing data.
  spec: ["TS 23.002 §6a.14.1"]

- id: Nu
  name: Nu
  generations: [4G]
  endpoints: [SCEF, PFDF]
  protocol: HTTP
  aliases: []
  description: >-
    The reference point between the SCEF and the PFDF. The SCEF adds, updates, and removes Packet Flow
    Descriptions in the PFDF on behalf of third-party SCS/AS providers.
  spec: ["TS 23.002 §6a.16.10"]

- id: MB2
  name: MB2
  generations: [4G]
  endpoints: [GCS-AS, BM-SC]
  protocol: Diameter / IP
  aliases: []
  description: >-
    The reference point between a GCS AS and the BM-SC for group communication over LTE. It starts,
    stops, and modifies MBMS broadcast bearers and carries the group application data to broadcast.
  spec: ["TS 23.002 §6a.17.1"]

- id: GC1
  name: GC1
  generations: [4G]
  endpoints: [UE, GCS-AS]
  protocol: Application-defined
  aliases: []
  description: >-
    The application-level reference point between the UE and the GCS AS. It carries group communication
    signalling and application data, over unicast bearers or alongside MBMS delivery.
  spec: ["TS 23.002 §6a.17.2"]

- id: PC1
  name: PC1
  generations: [4G]
  endpoints: [UE, ProSe-AS]
  protocol: Application-defined
  aliases: []
  description: >-
    The application-level reference point between the ProSe application in the UE and the ProSe
    Application Server. Its signalling is left to the application and not specified by 3GPP.
  spec: ["TS 23.002 §6a.18.1"]

- id: PC2
  name: PC2
  generations: [4G]
  endpoints: [ProSe-AS, ProSe-Function]
  protocol: Diameter
  aliases: []
  description: >-
    The reference point between the ProSe Application Server and the ProSe Function. It supports EPC-
    level ProSe discovery, for example by translating application user identities into network
    identities.
  spec: ["TS 23.002 §6a.18.2", "TS 29.343"]

- id: PC3
  name: PC3
  generations: [4G]
  endpoints: [UE, ProSe-Function]
  protocol: HTTP
  aliases: []
  description: >-
    The over-IP reference point between the UE and the ProSe Function. It authorises discovery requests,
    allocates ProSe Application Codes, and provisions per-PLMN policy for direct discovery and
    communication.
  spec: ["TS 23.002 §6a.18.3"]

- id: PC4a
  name: PC4a
  generations: [4G]
  endpoints: [ProSe-Function, HSS]
  protocol: Diameter
  aliases: []
  description: >-
    The reference point between the ProSe Function and the HSS. It provides per-PLMN ProSe subscription
    data for authorising direct discovery and communication, and EPC-level discovery subscriber data.
  spec: ["TS 23.002 §6a.18.4"]

- id: PC4b
  name: PC4b
  generations: [4G]
  endpoints: [ProSe-Function, SLP]
  protocol: OMA MLP
  aliases: []
  description: >-
    The reference point between the ProSe Function and the SUPL Location Platform. The ProSe Function
    acts as an LCS client and queries the SLP for UE locations during EPC-level discovery.
  spec: ["TS 23.002 §6a.18.5"]

- id: PC5
  name: PC5
  generations: [4G]
  endpoints: [UE, UE]
  protocol: PC5 (sidelink)
  aliases: []
  description: >-
    The direct radio link between ProSe-enabled UEs, without passing through the network. It carries
    control and user plane traffic for direct discovery, direct communication, and UE-to-network relay.
  spec: ["TS 23.002 §6a.18.6"]

- id: PC6
  name: PC6
  generations: [4G]
  endpoints: [ProSe-Function, ProSe-Function]
  protocol: Diameter
  aliases: []
  description: >-
    The reference point between ProSe Functions in different PLMNs, such as home and local. It
    authorises discovery requests, retrieves discovery filters, and translates ProSe Application Codes
    to application IDs.
  spec: ["TS 23.002 §6a.18.7", "TS 29.345"]

- id: PC7
  name: PC7
  generations: [4G]
  endpoints: [ProSe-Function, ProSe-Function]
  protocol: Diameter
  aliases: []
  description: >-
    The reference point between the home and visited ProSe Functions. It lets the home network control
    ProSe service authorization and handles discovery authorization, filters, and code translation.
  spec: ["TS 23.002 §6a.18.8", "TS 29.345"]

- id: Nq
  name: Nq
  generations: [4G]
  endpoints: [MME, RCAF]
  protocol: Diameter
  aliases: []
  description: >-
    The reference point between the MME and the RCAF. The RCAF retrieves the UEs served by a congested
    eNodeB or cell and the APNs of their active PDN connections.
  spec: ["TS 23.002 §6a.19.2", "TS 23.401"]

- id: Mm
  name: Mm
  generations: [IMS]
  endpoints: [IBCF, DN]
  protocol: SIP
  aliases: []
  description: >-
    The IP signalling interface between a CSCF or IBCF and external multimedia IP networks. It exchanges
    SIP session requests with other SIP servers or terminals outside the IMS.
  spec: ["TS 23.002 §7.4"]

# --- 5GS reference points, CUPS (TS 23.214), NG-RAN split, and charging ---

- id: N16a
  name: N16a
  generations: [5G]
  endpoints: [SMF, I-SMF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the anchor SMF and an I-SMF inserted for a PDU session. It uses
    Nsmf_PDUSession to pass N4 rules and QoS information that the I-SMF applies to the UPFs it controls.
  spec: ["TS 23.501 §4.2.7", "TS 29.502"]

- id: N38
  name: N38
  generations: [5G]
  endpoints: [I-SMF, I-SMF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between I-SMFs and between V-SMFs, in the same or different PLMNs. It transfers
    the SM context and forwarding tunnel information when the I-SMF or V-SMF of a PDU session changes.
  spec: ["TS 23.501 §4.2.7", "TS 29.502"]

- id: N41
  name: N41
  generations: [5G]
  endpoints: [AMF, CHF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the CHF in the home PLMN. It uses Nchf_ConvergedCharging to
    report registration, mobility, and connection events for charging.
  spec: ["TS 23.501 §4.2.7", "TS 32.256", "TS 32.291"]

- id: N42
  name: N42
  generations: [5G]
  endpoints: [AMF, CHF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the CHF in the visited PLMN. It uses Nchf_ConvergedCharging
    so the VPLMN can charge for the registration, mobility, and connection events of roaming UEs.
  spec: ["TS 23.501 §4.2.7", "TS 32.256", "TS 32.291"]

- id: N43
  name: N43
  generations: [5G]
  endpoints: [PCF, PCF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the PCF for the UE and the PCF for the PDU session. It is used, for
    example, with Npcf_UEPolicyControl to deliver URSP rules to a UE served over EPS.
  spec: ["TS 23.501 §4.2.7", "TS 23.503", "TS 29.525"]

- id: N55
  name: N55
  generations: [5G]
  endpoints: [AMF, UCMF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the UCMF. It uses Nucmf_UECapabilityManagement to assign UE
    radio capability IDs and resolve them into full radio capabilities.
  spec: ["TS 23.501 §4.2.7", "TS 29.673"]

- id: N56
  name: N56
  generations: [5G]
  endpoints: [NEF, UCMF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the NEF and the UCMF. It lets an external AF provision manufacturer-
    assigned UE radio capability IDs in the UCMF through the NEF.
  spec: ["TS 23.501 §4.2.7", "TS 23.502"]

- id: N57
  name: N57
  generations: [5G]
  endpoints: [AF, UCMF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between a trusted AF and the UCMF. The AF uses Nucmf_Provisioning to provision
    manufacturer-assigned UE radio capability IDs directly, without the NEF.
  spec: ["TS 23.501 §4.2.7", "TS 23.502"]

- id: N60
  name: N60
  generations: [5G]
  endpoints: [AUSF, NSWOF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AUSF and the NSWOF. It uses Nausf_UEauthentication to authenticate a
    UE with its 5GS credentials when it connects to a WLAN for non-seamless offload.
  spec: ["TS 23.501 §4.2.7", "TS 33.501", "TS 29.509"]

- id: N80
  name: N80
  generations: [5G]
  endpoints: [AMF, NSACF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AMF and the NSACF. It uses Nnsacf_NSAC to check and update the
    number of UEs registered on a network slice before admitting a UE.
  spec: ["TS 23.501 §4.2.7", "TS 29.536"]

- id: N81
  name: N81
  generations: [5G]
  endpoints: [SMF, NSACF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the SMF and the NSACF. It uses Nnsacf_NSAC to check and update the
    number of PDU sessions on a network slice before admitting a session.
  spec: ["TS 23.501 §4.2.7", "TS 29.536"]

- id: N82
  name: N82
  generations: [5G]
  endpoints: [NSACF, NEF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the NSACF and the NEF. It uses Nnsacf_SliceEventExposure to report slice
    status, such as current UE and PDU session counts, toward an AF.
  spec: ["TS 23.501 §4.2.7", "TS 29.536"]

- id: N83
  name: N83
  generations: [5G]
  endpoints: [AUSF, NSSAAF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the AUSF and the NSSAAF. It uses Nnssaaf_AIW to relay EAP authentication
    toward an external AAA server, for example for SNPN access with credentials from a credentials
    holder.
  spec: ["TS 23.501 §4.2.7", "TS 29.526"]

- id: N84
  name: N84
  generations: [5G]
  endpoints: [TSCTSF, PCF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the TSCTSF and the PCF. The TSCTSF uses Npcf_PolicyAuthorization to pass
    QoS requirements, TSC assistance containers, and time synchronization settings for a PDU session.
  spec: ["TS 23.501 §4.2.7", "TS 29.514"]

- id: N85
  name: N85
  generations: [5G]
  endpoints: [TSCTSF, NEF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the TSCTSF and the NEF. The NEF relays external AF requests for time
    synchronization and time sensitive QoS to the TSCTSF services.
  spec: ["TS 23.501 §4.2.7", "TS 29.565"]

- id: N86
  name: N86
  generations: [5G]
  endpoints: [TSCTSF, AF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the TSCTSF and a trusted AF. The AF uses the TSCTSF services directly to
    request time synchronization and QoS for time sensitive traffic.
  spec: ["TS 23.501 §4.2.7", "TS 29.565"]

- id: N87
  name: N87
  generations: [5G]
  endpoints: [TSCTSF, UDM]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the TSCTSF and the UDM. The TSCTSF uses Nudm_SDM to fetch time
    synchronization subscription data and to resolve GPSIs and group IDs into SUPIs.
  spec: ["TS 23.501 §4.2.7", "TS 29.503"]

- id: N88
  name: N88
  generations: [5G]
  endpoints: [SMF, EASDF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the SMF and the EASDF. The SMF uses Neasdf_DNSContext to install rules
    for handling a PDU session's DNS messages and to receive DNS message reports.
  spec: ["TS 23.501 §4.2.7", "TS 23.548", "TS 29.556"]

- id: N89
  name: N89
  generations: [5G]
  endpoints: [TSCTSF, AMF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the TSCTSF and the AMF. The TSCTSF subscribes to UE presence in an area
    of interest and sends non-UE N2 messages to configure and monitor NG-RAN time synchronization.
  spec: ["TS 23.501 §4.2.7", "TS 29.518"]

- id: N96
  name: N96
  generations: [5G]
  endpoints: [TSCTSF, NRF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between the TSCTSF and the NRF. The TSCTSF uses Nnrf_NFDiscovery, for example to
    find the AMFs serving the tracking areas of a time synchronization coverage area.
  spec: ["TS 23.501 §4.2.7", "TS 29.510"]

- id: N97
  name: N97
  generations: [5G]
  endpoints: [NSACF, NSACF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between NSACFs in different PLMNs. A VPLMN NSACF uses it to reach the HPLMN
    primary or central NSACF for slice admission control of inbound roamers.
  spec: ["TS 23.501 §4.2.7", "TS 29.536"]

- id: N99
  name: N99
  generations: [5G]
  endpoints: [NSACF, NSACF]
  protocol: HTTP/2 (SBI)
  aliases: []
  description: >-
    The reference point between NSACFs in the same PLMN. In a hierarchical deployment, NSACFs use it to
    obtain and return slice quota from the primary NSACF.
  spec: ["TS 23.501 §4.2.7", "TS 29.536"]

- id: Sxa
  name: Sxa
  generations: [4G]
  endpoints: [SGW-C, SGW-U]
  protocol: PFCP
  aliases: []
  description: >-
    The reference point between the SGW-C and the SGW-U. The SGW-C installs packet detection,
    forwarding, and buffering rules, and the SGW-U reports usage and downlink data arrival for idle UEs.
  spec: ["TS 23.214 §4.2.3", "TS 29.244"]

- id: Sxb
  name: Sxb
  generations: [4G]
  endpoints: [PGW-C, PGW-U]
  protocol: PFCP
  aliases: []
  description: >-
    The reference point between the PGW-C and the PGW-U. The PGW-C installs detection, forwarding, QoS,
    and usage reporting rules for bearers. In 5GS interworking, a PGW-C+SMF uses N4 toward a UPF+PGW-U
    instead.
  spec: ["TS 23.214 §4.2.3", "TS 23.501 §4.3.1", "TS 29.244"]

- id: Sxc
  name: Sxc
  generations: [4G]
  endpoints: [TDF-C, TDF-U]
  protocol: PFCP
  aliases: []
  description: >-
    The reference point between the TDF-C and the TDF-U. The TDF-C installs application detection and
    enforcement rules, and the TDF-U reports detected applications and usage.
  spec: ["TS 23.214 §4.2.3", "TS 29.244"]

- id: Sxa-Sxb
  name: Sxa/Sxb
  generations: [4G]
  endpoints: [SGW-PGW-C, SGW-PGW-U]
  protocol: PFCP
  aliases: []
  description: >-
    The reference point between the control and user plane functions of a combined SGW/PGW. It uses the
    same Sx parameter structure and covers only the functionality of Sxa and Sxb.
  spec: ["TS 23.214 §4.2.2", "TS 29.244"]

- id: S11-U
  name: S11-U
  generations: [4G]
  endpoints: [MME, SGW]
  protocol: GTP-U
  aliases: []
  description: >-
    The user-plane reference point between the MME and the SGW, used for Control Plane CIoT EPS
    Optimisation. It carries user data sent in NAS messages; with CUPS it terminates on the SGW-U.
  spec: ["TS 23.401 §4.2.3", "TS 23.214 §4.2.1", "TS 29.281"]

- id: F1-C
  name: F1-C
  generations: [5G]
  endpoints: [gNB-CU-CP, gNB-DU]
  protocol: F1AP
  aliases: []
  description: >-
    The control-plane interface between the gNB-CU-CP and a gNB-DU. It carries F1AP over SCTP for UE
    context management, RRC message transfer, system information, and cell management.
  spec: ["TS 38.401", "TS 38.473"]

- id: F1-U
  name: F1-U
  generations: [5G]
  endpoints: [gNB-CU-UP, gNB-DU]
  protocol: GTP-U
  aliases: []
  description: >-
    The user-plane interface between the gNB-CU-UP and a gNB-DU. It carries user data for each data
    radio bearer in GTP-U tunnels, with flow control feedback from the DU.
  spec: ["TS 38.401", "TS 38.470", "TS 38.474"]

- id: E1
  name: E1
  generations: [5G]
  endpoints: [gNB-CU-CP, gNB-CU-UP]
  protocol: E1AP
  aliases: []
  description: >-
    The interface between the gNB-CU-CP and the gNB-CU-UP. The CU-CP uses E1AP to set up, modify, and
    release bearer contexts in the CU-UP for each UE.
  spec: ["TS 38.401", "TS 38.463"]

- id: Ga
  name: Ga
  generations: [2G, 3G, 4G, IMS]
  endpoints: [CDF, CGF]
  protocol: GTP'
  aliases: []
  description: >-
    The offline charging interface between the CDF and the CGF. It carries CDRs over GTP' (GTP prime),
    which the CGF then validates, consolidates, and passes to the billing domain.
  spec: ["TS 32.240", "TS 32.295"]
